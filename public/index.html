<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Pro V5 — 20 Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.10/css/litegraph.css">
    <script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.10/build/litegraph.min.js"></script>
    <style>
        :root { --bg-deep:#0a0f1a; --accent:#3b82f6; --success:#22c55e; --danger:#ef4444; --warning:#f59e0b; }
        * { box-sizing: border-box; }
        html, body { height:100%; margin:0; }
        body { background:var(--bg-deep); color:#e2e8f0; overflow:hidden; font-family:'Inter',-apple-system,sans-serif; font-size:14px; display:flex; height:100vh; }
        #canvasHost { flex:1; position:relative; overflow:hidden; min-width:0; min-height:0; background:#0f172a; }
        #mycanvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }
        .glass { background:rgba(17,24,39,0.85); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.06); }
        .node-item { transition:all 0.15s; cursor:pointer; user-select:none; }
        .node-item:hover { background:rgba(59,130,246,0.08); border-color:var(--accent); transform:translateX(3px); }
        .log-entry { padding:8px 12px; border-radius:6px; margin-bottom:6px; font-size:12px; line-height:1.4; border-left:3px solid transparent; animation:fadeSlide 0.2s; word-break:break-word; }
        .log-entry.info    { background:rgba(59,130,246,0.08); border-left-color:var(--accent); color:#93c5fd; }
        .log-entry.success { background:rgba(34,197,94,0.08);  border-left-color:var(--success); color:#86efac; }
        .log-entry.error   { background:rgba(239,68,68,0.08);  border-left-color:var(--danger);  color:#fca5a5; }
        .log-entry.warn    { background:rgba(245,158,11,0.08); border-left-color:var(--warning); color:#fcd34d; }
        @keyframes fadeSlide { from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }
        .result-card { margin-top:12px; padding:14px 16px; background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(34,197,94,0.04)); border:1px solid rgba(34,197,94,0.4); border-radius:10px; font-weight:600; color:#4ade80; }
        
        #runBtn { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(-45deg, #3b82f6, #2563eb, #8b5cf6, #3b82f6);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(59,130,246,0.3);
            /* Ensure it fits perfectly */
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto;
        }
        #runBtn:hover:not(:disabled) { 
            transform: none; /* Removed scale and translateY to stop overflow */
            box-shadow: 0 0 25px rgba(59,130,246,0.5);
            filter: brightness(1.1);
        }
        #runBtn:active { transform: scale(0.98); }
        #runBtn:disabled { 
            background: #334155; 
            box-shadow: none; 
            opacity: 0.7; 
            cursor: not-allowed; 
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        #runBtn:disabled { opacity:0.7; cursor:not-allowed; }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-thumb { background:#334155; border-radius:4px; }
        #toastContainer { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        .toast { padding:10px 20px; border-radius:8px; font-size:13px; font-weight:500; pointer-events:auto; transition:opacity 0.25s,transform 0.25s; color:white; }
        .toast.info { background:rgba(59,130,246,0.9); }
        .toast.success { background:rgba(34,197,94,0.9); }
        .toast.error { background:rgba(239,68,68,0.9); }
        .kbd { display:inline-block; padding:2px 6px; font-size:10px; font-family:monospace; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:4px; color:#cbd5e1; }
        .top-bar { pointer-events:none; }
        .top-bar > * { pointer-events:auto; }
        .sidebar-input { background:#1e293b; border:1px solid #334155; border-radius:6px; padding:6px 10px; font-size:12px; color:#e2e8f0; width:100%; outline:none; }
        .sidebar-input:focus { border-color:#3b82f6; }
        .sidebar-btn { padding:7px 10px; border-radius:6px; font-size:11px; font-weight:700; color:white; cursor:pointer; transition:all 0.15s; border:none; width:100%; display:flex; align-items:center; justify-content:center; gap:6px; }
        .sidebar-btn:hover { filter:brightness(1.15); }
        .tool-badge { display:inline-block; padding:1px 6px; font-size:9px; font-weight:700; border-radius:3px; margin-left:auto; }
        .tool-badge.configured { background:rgba(34,197,94,0.2); color:#86efac; }
        .tool-badge.missing    { background:rgba(239,68,68,0.2); color:#fca5a5; }
        /* Modal */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:99999; display:flex; align-items:center; justify-content:center; }
        .modal { background:#0f172a; border:1px solid #334155; border-radius:12px; padding:24px; width:480px; max-width:90vw; max-height:85vh; overflow-y:auto; }
        .modal h2 { margin-top:0; font-size:18px; color:#e2e8f0; }
        .modal label { display:block; font-size:11px; color:#94a3b8; margin:10px 0 4px; text-transform:uppercase; letter-spacing:0.05em; }
        .modal input, .modal textarea { width:100%; background:#1e293b; border:1px solid #334155; border-radius:6px; padding:8px 10px; font-size:12px; color:#e2e8f0; font-family:monospace; outline:none; }
        .modal input:focus, .modal textarea:focus { border-color:#3b82f6; }
        .modal-buttons { display:flex; gap:8px; margin-top:20px; justify-content:flex-end; }
        .modal-btn { padding:8px 18px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; border:none; }
        .modal-btn.primary { background:#3b82f6; color:white; }
        .modal-btn.secondary { background:#334155; color:#cbd5e1; }
    
        /* Professional sidebar button system */
        .pro-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            height: 34px;
            width: 100%;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: #cbd5e1;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
            text-align: left;
        }
        .pro-btn:hover {
            background: rgba(148, 163, 184, 0.08);
            color: #f1f5f9;
        }
        .pro-btn:active {
            background: rgba(148, 163, 184, 0.14);
        }
        .pro-btn i {
            font-size: 12px;
            color: #64748b;
            width: 14px;
            text-align: center;
            transition: color 0.12s ease;
        }
        .pro-btn:hover i {
            color: #94a3b8;
        }
        .pro-btn .shortcut {
            margin-left: auto;
            font-size: 10px;
            color: #475569;
            font-family: ui-monospace, monospace;
        }

        /* Primary action — subtle accent, no glow */
        .pro-btn.primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .pro-btn.primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }
        .pro-btn.primary i {
            color: #bfdbfe;
        }

        /* Danger — neutral until hover */
        .pro-btn.danger {
            color: #94a3b8;
        }
        .pro-btn.danger i {
            color: #64748b;
        }
        .pro-btn.danger:hover {
            background: rgba(239, 68, 68, 0.08);
            color: #fca5a5;
        }
        .pro-btn.danger:hover i {
            color: #f87171;
        }

        /* Section label */
        .pro-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #475569;
            padding: 0 12px;
            margin: 16px 0 6px;
        }

        /* Sidebar container tighter */
        .pro-sidebar-section {
            padding: 0 12px 12px;
        }

        /* Workflow input — professional */
        .pro-input {
            width: 100%;
            height: 32px;
            padding: 0 10px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 12px;
            font-family: ui-monospace, monospace;
            outline: none;
            transition: border-color 0.12s ease;
        }
        .pro-input::placeholder {
            color: #475569;
        }
        .pro-input:focus {
            border-color: #3b82f6;
        }

        /* Node library rows — cleaner */
        .pro-node {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.12s ease, border-color 0.12s ease;
        }
        .pro-node:hover {
            background: rgba(148, 163, 184, 0.06);
            border-color: #1e293b;
        }
        .pro-node-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(148, 163, 184, 0.08);
            color: #94a3b8;
            font-size: 11px;
        }
        .pro-node:hover .pro-node-icon {
            background: rgba(148, 163, 184, 0.14);
            color: #cbd5e1;
        }
        .pro-node-text {
            font-size: 12px;
            font-weight: 500;
            color: #cbd5e1;
            flex: 1;
        }
        .pro-node:hover .pro-node-text {
            color: #f1f5f9;
        }

    
        /* Compact node library rows */
        .node-item {
            transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
            cursor: pointer;
            user-select: none;
            padding: 6px 8px !important;
            border-radius: 6px !important;
        }
        .node-item:hover {
            background: rgba(59,130,246,0.06);
            border-color: #3b82f6;
            transform: translateX(2px);
        }
        .node-item:active { transform: translateX(1px); }
        .node-item .w-7,
        .node-item .w-8 { width: 22px !important; height: 22px !important; }
        .node-item .w-7 i,
        .node-item .w-8 i { font-size: 10px !important; }
        .node-item .flex-1 > div:first-child {
            font-size: 11px !important;
            line-height: 1.2;
        }
        .node-item .flex-1 > div:last-child {
            font-size: 9px !important;
            line-height: 1.1;
            margin-top: 1px;
        }

    
        /* ---- AI Chat Panel ---- */
        #aiPanel {
            position: fixed !important;
            bottom: 16px !important;
            right: 16px !important;
            left: auto !important;
            top: auto !important;
            width: 340px;
            height: 429px;
            z-index: 9997;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            transition: height 0.2s, width 0.2s;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        #aiPanel.collapsed {
            height: 42px;
        }
        
        #aiBody {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        #aiPanel.collapsed #aiBody,
        #aiPanel.collapsed #aiInputRow,
        #aiPanel.collapsed #aiQuickActions {
            display: none;
        }
        .ai-msg {
            font-size: 12px;
            line-height: 1.5;
            padding: 10px 12px;
            border-radius: 8px;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: aiFadeIn 0.2s ease;
        }
        .ai-msg.user {
            background: #1e40af;
            color: #dbeafe;
            align-self: flex-end;
            max-width: 85%;
            border-bottom-right-radius: 2px;
        }
        .ai-msg.bot {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            max-width: 95%;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .ai-msg.bot code {
            background: #0f172a;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: ui-monospace, monospace;
            font-size: 12px;
            color: #93c5fd;
        }
        .ai-msg.bot pre {
            background: #0f172a;
            padding: 8px 10px;
            border-radius: 5px;
            margin: 6px 0;
            overflow-x: auto;
            font-family: ui-monospace, monospace;
            font-size: 11px;
            color: #93c5fd;
            border: 1px solid #334155;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .ai-msg.bot strong {
            color: #f1f5f9;
        }
        .ai-msg.bot a {
            color: #60a5fa;
            text-decoration: underline;
        }
        .ai-thinking {
            align-self: flex-start;
            color: #64748b;
            font-size: 12px;
            font-style: italic;
            padding: 8px 12px;
        }
        .ai-thinking::after {
            content: '';
            display: inline-block;
            animation: dots 1.4s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        @keyframes aiFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #aiQuickActions {
            padding: 6px 10px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-top: 1px solid #1e293b;
            background: #0a0f1a;
            flex-shrink: 0;
        }
        .ai-quick-btn {
            padding: 4px 8px;
            border-radius: 5px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 10px;
            border: 1px solid #334155;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .ai-quick-btn:hover {
            background: #334155;
            color: #e2e8f0;
            border-color: #3b82f6;
        }
        #aiInputRow {
            padding: 8px 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #1e293b;
            background: #0a0f1a;
            flex-shrink: 0;
        }
        #aiInput {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 10px;
            color: #e2e8f0;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            resize: none;
            min-height: 32px;
            max-height: 80px;
            line-height: 1.4;
        }
        #aiInput:focus {
            border-color: #3b82f6;
        }
        #aiSendBtn {
            padding: 8px 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        #aiSendBtn:hover:not(:disabled) {
            background: #2563eb;
        }
        #aiSendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

    
        /* Tool credential icon — clean, no colored blur */
        .tool-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: rgba(148, 163, 184, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.08);
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .tool-icon i {
            font-size: 14px;
            color: var(--tool-color, #94a3b8);
            opacity: 0.9;
            transition: opacity 0.15s ease;
        }
        .tool-icon:hover {
            background: rgba(148, 163, 184, 0.12);
            border-color: rgba(148, 163, 184, 0.18);
        }
        .tool-icon:hover i {
            opacity: 1;
        }

    
        /* AI Model Selector */
        #aiModelSelector {
            appearance: none;
            -webkit-appearance: none;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 3px 20px 3px 8px;
            font-size: 10px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='6' height='4' viewBox='0 0 6 4'%3e%3cpath fill='%2364748b' d='M0 0l3 4 3-4z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 6px;
        }
        #aiModelSelector:hover {
            border-color: #3b82f6;
            color: #e2e8f0;
        }
        #aiModelSelector:focus {
            outline: none;
            border-color: #3b82f6;
        }
        #aiModelSelector option {
            background: #0f172a;
            color: #e2e8f0;
            padding: 4px;
        }
        #aiModelSelector option:disabled {
            color: #475569;
        }

    
        /* AI Code Block with Copy Button */
        .ai-code-block {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            margin: 8px 0;
            overflow: hidden;
            font-family: ui-monospace, monospace;
        }
        .ai-code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(30, 41, 59, 0.6);
            border-bottom: 1px solid #334155;
        }
        .ai-code-lang {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .ai-copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: transparent;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
        }
        .ai-copy-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #60a5fa;
        }
        .ai-copy-btn:active {
            background: rgba(59, 130, 246, 0.2);
        }
        .ai-code-content {
            padding: 10px 12px;
            margin: 0;
            font-size: 11px;
            line-height: 1.5;
            color: #93c5fd;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
        .ai-code-content code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

    
        /* ---- Code Editor Modal ---- */
        #codeModalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100000;
            align-items: center;
            justify-content: center;
        }
        #codeModalOverlay.active {
            display: flex;
        }
        #codeModal {
            width: 90vw;
            max-width: 1200px;
            height: 85vh;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }
        #codeModalHeader {
            padding: 16px 20px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            flex-shrink: 0;
        }
        #codeModalHeader .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #codeModalHeader .modal-title i {
            color: #a855f7;
        }
        #codeModalLang {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #cbd5e1;
            padding: 6px 12px;
            font-size: 12px;
            font-family: ui-monospace, monospace;
            cursor: pointer;
        }
        #codeModalLang:focus {
            outline: none;
            border-color: #3b82f6;
        }
        #codeModalHeader button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        #codeSaveBtn {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        #codeSaveBtn:hover {
            background: #1d4ed8;
        }
        #codeCancelBtn {
            background: transparent;
            color: #94a3b8;
            border-color: #334155;
        }
        #codeCancelBtn:hover {
            background: rgba(148, 163, 184, 0.1);
            color: #e2e8f0;
        }
        #codeTestBtn {
            background: #059669;
            color: white;
            border-color: #059669;
        }
        #codeTestBtn:hover {
            background: #047857;
        }
        #codeTestBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #codeModalBody {
            flex: 1;
            display: flex;

// === PATCH: keep node value dialogs open until click ===
// LiteGraph 0.7.10 hardcodes close-on-mouseleave in prompt() — override it.
// Stay open on mouse move; close on outside click / OK / Enter / Esc.
(function() {
  if (typeof LGraphCanvas === "undefined") {
    console.warn("[patch] LGraphCanvas not found — skip value-dialog fix");
    return;
  }
  LGraphCanvas.prototype.prompt = function(title, value, callback, event, multiline) {
    var that = this;
    var dialog = document.createElement("div");
    dialog.className = "graphdialog rounded";
    if (multiline) {
      dialog.innerHTML = "<span class='name'></span> <textarea autofocus class='value'></textarea><button class='rounded'>OK</button>";
    } else {
      dialog.innerHTML = "<span class='name'></span> <input autofocus type='text' class='value'/><button class='rounded'>OK</button>";
    }

    var closed = false;
    function cleanupOutside() {
      document.removeEventListener("mousedown", onOutside, true);
      document.removeEventListener("pointerdown", onOutside, true);
    }
    dialog.close = function() {
      if (closed) return;
      closed = true;
      cleanupOutside();
      that.prompt_box = null;
      if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
    };

    if (this.ds && this.ds.scale > 1) {
      dialog.style.transform = "scale(" + this.ds.scale + ")";
    }
    // NO mouseleave — does not close when mouse moves away

    if (that.prompt_box) that.prompt_box.close();
    that.prompt_box = dialog;

    var nameEl = dialog.querySelector(".name");
    if (nameEl) nameEl.innerText = title || "";
    var input = dialog.querySelector(".value");
    if (input) input.value = value != null ? value : "";

    function commit() {
      if (callback && input) callback(input.value);
      if (that.setDirty) that.setDirty(true);
      dialog.close();
    }

    if (input) {
      input.addEventListener("keydown", function(e) {
        if (e.keyCode === 27) { // Esc — cancel
          dialog.close();
        } else if (e.keyCode === 13 && e.target.localName !== "textarea") { // Enter — save
          commit();
        } else {
          return;
        }
        e.preventDefault();
        e.stopPropagation();
      });
    }

    var button = dialog.querySelector("button");
    if (button) {
      button.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        commit();
      });
    }

    // Close when clicking outside the dialog (not on mouse move)
    function onOutside(e) {
      if (closed) return;
      if (dialog.contains(e.target)) return;
      dialog.close();
    }
    // Delay so the same click that opened the prompt does not immediately close it
    setTimeout(function() {
      if (closed) return;
      document.addEventListener("mousedown", onOutside, true);
      document.addEventListener("pointerdown", onOutside, true);
    }, 0);

    var graphcanvas = LGraphCanvas.active_canvas;
    var canvas = graphcanvas ? graphcanvas.canvas : null;
    if (canvas) {
      var rect = canvas.getBoundingClientRect();
      var ox = -20, oy = -20;
      if (rect) { ox -= rect.left; oy -= rect.top; }
      if (event) {
        dialog.style.left = (event.clientX + ox) + "px";
        dialog.style.top  = (event.clientY + oy) + "px";
      } else {
        dialog.style.left = (canvas.width * 0.5 + ox) + "px";
        dialog.style.top  = (canvas.height * 0.5 + oy) + "px";
      }
      if (canvas.parentNode) canvas.parentNode.appendChild(dialog);
    } else {
      document.body.appendChild(dialog);
    }

    if (input) {
      input.focus();
      if (input.select) input.select();
    }
    return dialog;
  };
  console.log("[patch] Node value dialogs: open until outside-click / OK / Enter / Esc");
})();
// === END PATCH: keep node value dialogs open ===

function fitCanvas() {
    const cvs = canvas.canvas, rect = cvs.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
    if (cvs.width !== w || cvs.height !== h) {
        cvs.width = w; cvs.height = h;
        canvas.setDirty(true, true); canvas.draw(true);
    }
}

canvas.getNodeOnPos = function(x,y,list,margin) {
    const nodes = list || this.graph._nodes; margin = margin || 0;
    for (let i = nodes.length-1; i >= 0; i--) {
        const n = nodes[i]; if (!n) continue;
        const s = n.size;
        if (x>=n.pos[0]-margin && y>=n.pos[1]-margin && x<=n.pos[0]+s[0]+margin && y<=n.pos[1]+s[1]+margin) return n;
    }
    return null;
};

const _origDown = canvas.processMouseDown.bind(canvas);
canvas.processMouseDown = function(e) {
    const hit = this.getNodeOnPos(e.canvasX, e.canvasY, this.graph._nodes);
    if (hit && !this.read_only) {
        this.selected_nodes = {}; this.selected_nodes[hit.id] = hit; hit.is_selected = true;
    }
    const r = _origDown(e);
    if (hit && !this.read_only) setTimeout(() => {
        try {
            const idx = this.graph._nodes.indexOf(hit);
            if (idx !== -1 && idx !== this.graph._nodes.length-1) {
                this.graph._nodes.splice(idx, 1); this.graph._nodes.push(hit);
            }
            this.setDirty(true, true);
        } catch(_) {}
    }, 0);
    return r;
};

/**

 * @param {Object} node - The LiteGraph node instance.

function applyNodeTheme(node, theme) {

    node.bgcolor = theme.body;
    node.title_text_color = theme.text;
    node.border_color = theme.accent;
    node.boxcolor = theme.accent;
    node.shape = LiteGraph.ROUND_SHAPE;

    // Professional Port Styling
    const portStyle = {
        color: "#ffffff",
        color_off: "#64748b", // Slate 500 (muted when inactive)
        link_color: theme.accent
    };

    (node.inputs || []).forEach(input => Object.assign(input, portStyle));
    (node.outputs || []).forEach(output => Object.assign(output, portStyle));
}

// Add node
let spawnOffset = 0;
function addNode(type) {
    try {
        fitCanvas();
        const node = LiteGraph.createNode(type);
        if (!node) throw new Error(`Unknown: ${type}`);
        const rect = canvas.canvas.getBoundingClientRect(), ds = canvas.ds;
        const cx = (rect.width/2 - ds.offset[0]) / ds.scale;
        const cy = (rect.height/2 - ds.offset[1]) / ds.scale;
        const step = spawnOffset % 10;
        node.pos = [cx - 100 + step*30, cy - 50 + step*25];
        spawnOffset++;
        graph.add(node);
        canvas.selected_nodes = {};
        canvas.setDirty(true, true);
        toast(`Added: ${node.title}`, 'info', 1200);
    } catch (e) { toast(`Error: ${e.message}`, 'error'); console.error(e); }
}

// Build payload

// ============================================================
// Safe JSON helpers — must exist before buildPayload() runs
// ============================================================
function safeJsonParse(str) {
    if (str === null || str === undefined) return null;
    if (typeof str === 'object') return str;  // already parsed
    if (typeof str !== 'string') return str;
    const trimmed = str.trim();
    if (trimmed === '') return null;
    try {
        return JSON.parse(trimmed);
    } catch (e) {
        console.warn('safeJsonParse: invalid JSON, returning raw string:', trimmed.slice(0, 100));
        return trimmed;  // fallback — pass raw string through
    }
}

function safeJsonStringify(val) {
    try {
        return JSON.stringify(val);
    } catch (e) {
        console.warn('safeJsonStringify failed:', e);
        return String(val);
    }
}

function buildPayload() {
    const visited = new Set(), ordered = [];
    function visit(n) {
        if (!n || visited.has(n)) return;
        visited.add(n);
        (n.inputs||[]).forEach(input => {
            if (input.link != null) {
                const link = graph.links[input.link];
                if (link) visit(graph.getNodeById(link.origin_id));
            }
        });
        ordered.push(n);
    }
    const hasWires = Object.keys(graph.links || {}).length > 0;
    if (hasWires) {
        const sinks = graph._nodes.filter(n => !n.outputs || n.outputs.every(o => o.link == null));
        (sinks.length ? sinks : graph._nodes).forEach(visit);
    } else graph._nodes.forEach(visit);

    // Only sort by stage if there are NO wires.
    // When wires exist, trust the topological order — it already follows edges.
    if (!hasWires) {
        const stageOrder = {
            'trigger/webhook':0, 'market/data':0,
            'logic/filter':1, 'logic/math':1, 'logic/compare':1, 'logic/json-extract':1, 'logic/code':1,
            'action/http':2, 'tool/integration':2, 'output/console':3,
        };
        ordered.sort((a,b) => (stageOrder[a.type]??99) - (stageOrder[b.type]??99));
    }

    const payload = [];
    for (const n of ordered) {
        const d = n.properties || {};
        switch (n.type) {
            case 'trigger/webhook': payload.push({type:'webhook-input', data:{}}); break;
            case 'market/data': payload.push({type:'market-data', data:{coin:d.coin||'bitcoin'}}); break;
            case 'logic/filter': payload.push({type:'filter', data:{keyword:d.keyword||'Price'}}); break;
            case 'logic/math': payload.push({type:'math', data:{op:d.op||'multiply', value:Number(d.value)||1}}); break;
            case 'logic/compare': payload.push({type:'compare', data:{operator:d.operator||'>', threshold:Number(d.threshold)||0}}); break;
            case 'logic/json-extract': payload.push({type:'json-extract', data:{path:d.path||''}}); break;
            case 'tool/integration': payload.push({type:'tool', data:{service:d.service||'http-custom', message:d.message||''}}); break;
            case 'action/http': payload.push({type:'http-request', data:{
                url: d.url || '',
                method: d.method || 'GET',
                body: d.body ? safeJsonParse(d.body) : null,
                headers: d.headers ? safeJsonParse(d.headers) : {}
            }}); break;
            case 'logic/delay': payload.push({type:'delay', data:{seconds: Number(d.seconds) || 5}}); break;
            case 'logic/code': payload.push({type:'code', data:{lang:d.lang||'javascript', code:d.code||''}}); break;
            case 'output/console': payload.push({type:'console', data:{}}); break;
        }
    }
    return payload;
}

// Logs
function classifyLog(m) {
    const s = m.toLowerCase();
    if (s.includes('error') || s.includes('reject') || s.includes('fail')) return 'error';
    if (s.includes('success') || s.includes('match') || s.includes('validat') || s.includes('pass')) return 'success';
    if (s.includes('skip') || s.includes('warn')) return 'warn';
    return 'info';
}
function renderLogs(logs, result) {
    const logDiv = document.getElementById('log');
    logDiv.innerHTML = '';
    (logs||[]).forEach(l => {
        const d = document.createElement('div');
        d.className = `log-entry ${classifyLog(l)}`;
        d.textContent = l; logDiv.appendChild(d);
    });
    if (result) {
        const r = document.createElement('div');
        r.className = 'result-card';
        r.innerHTML = `<i class="fas fa-check-circle mr-2"></i>${result}`;
        logDiv.appendChild(r);
    }
    logDiv.scrollTop = logDiv.scrollHeight;
}












































// Run
let isRunning = false;
async function run() {
    if (isRunning) return;
    const btn = document.getElementById('runBtn'), txt = document.getElementById('runBtnText'), log = document.getElementById('log');
    const payload = buildPayload();
    if (payload.length === 0) { toast('No nodes!','error'); return; }
    isRunning = true; btn.disabled = true; txt.textContent = 'EXECUTING...';
    btn.querySelector('i').className = 'fas fa-spinner fa-spin';
    log.innerHTML = '<div class="log-entry info">Sending...</div>';
    try {
        const wfName = document.getElementById('workflowName').value.trim() || 'manual';
        const res = await fetch('/run', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({nodes:payload, workflow_name:wfName}),
        });
        if (!res.ok) throw new Error(`Server ${res.status}`);
        const data = await res.json();
        renderLogs(data.logs, data.data);
        if (data.status === 'success' && data.data) toast('Workflow complete!','success');
        else toast('Finished','info');
    } catch (e) {
        log.innerHTML = `<div class="log-entry error">${e.message}</div>`;
        toast(e.message, 'error');
    } finally {
        isRunning = false; btn.disabled = false; txt.textContent = 'EXECUTE WORKFLOW';
        btn.querySelector('i').className = 'fas fa-play';
    }
}

let autosaveTimeout = null;

function triggerAutosave() {
    // Only autosave if a workflow is currently loaded
    const loadedContainer = document.getElementById('workflowLoadedContainer');
    if (loadedContainer.style.display === 'none') return;

    clearTimeout(autosaveTimeout);
    autosaveTimeout = setTimeout(async () => {
        const name = document.getElementById('currentLoadedName').textContent.trim();
        if (!name) return;

        const payload = {
            nodes: buildPayload(),
            graph: graph.serialize() 
        };

        try {
            const res = await fetch(`/workflows/${encodeURIComponent(name)}`, {
                method:'PUT', headers:{'Content-Type':'application/json'},
                body: JSON.stringify(payload),
            });
            if (res.ok) {
                console.log(`[Autosave] Saved: ${name}`);
                // Optional: tiny subtle toast, or just let it be silent
                // toast('Auto-saved', 'info', 1000);
            }
        } catch (e) {
            console.error('[Autosave] Failed:', e);
        }
    }, 2000); // Wait 2 seconds after last change
}

// Hook into LiteGraph events to trigger autosave
setTimeout(() => {
    if (typeof graph !== 'undefined') {
        const originalOnNodeAdded = graph.onNodeAdded;
        graph.onNodeAdded = function(node) {
            if (originalOnNodeAdded) originalOnNodeAdded.call(this, node);
            triggerAutosave();
        };

        const originalOnNodeRemoved = graph.onNodeRemoved;
        graph.onNodeRemoved = function(node) {
            if (originalOnNodeRemoved) originalOnNodeRemoved.call(this, node);
            triggerAutosave();
        };

        // Trigger on wire connections
        const originalOnConnectionChange = graph.onConnectionChange;
        graph.onConnectionChange = function(node) {
            if (originalOnConnectionChange) originalOnConnectionChange.call(this, node);
            triggerAutosave();
        };

        // Trigger on node movement/drag
        const originalOnNodeMoved = graph.onNodeMoved;
        graph.onNodeMoved = function(node) {
            if (originalOnNodeMoved) originalOnNodeMoved.call(this, node);
            triggerAutosave();
        };
        
        // Also trigger when widget values change by wrapping processMouseUp
        const originalProcessMouseUp = canvas.processMouseUp;
        canvas.processMouseUp = function(e) {
            const r = originalProcessMouseUp.call(this, e);
            triggerAutosave();
            return r;
        };
    }
}, 500);

        name = document.getElementById('currentLoadedName').textContent.trim();
    }
    
    if (!name) { 
        toast('Enter a workflow name first','error'); 
        resetWorkflowUI();
        return false; 
    }
    
    const payload = {
        nodes: buildPayload(),
        graph: graph.serialize() 
    };

    try {
        const res = await fetch(`/workflows/${encodeURIComponent(name)}`, {
            method:'PUT', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(payload),
        });
        
        if (res.ok) { 
            toast(`Saved: ${name}`,'success'); 
            await refreshWorkflowList(); 
            setLoadedUI(name); 
            return true; 
        }
        toast('Save failed','error'); return false;

async function refreshWorkflowList() {
    try {
        const res = await fetch('/workflows');
        const data = await res.json();
        const selector = document.getElementById('workflowSelector');
        const currentVal = selector.value;
        
        selector.innerHTML = '<option value="">-- Load saved --</option>';
        
        if (data.workflows && data.workflows.length > 0) {
            data.workflows.forEach(wfName => {
                const opt = document.createElement('option');
                opt.value = wfName;
                opt.textContent = wfName;
                selector.appendChild(opt);
            });
        }
        
        if (currentVal && data.workflows.includes(currentVal)) {
            selector.value = currentVal;
        }
    } catch (e) {
        console.warn("Could not load workflow list:", e);
    }
}

async function loadWorkflowFromSelector(name) {
    if (!name) return; 

    confirmLoadWorkflow(name, async () => {
        try {
            const res = await fetch(`/workflows/${encodeURIComponent(name)}`);
            if (!res.ok) throw new Error("Workflow not found");
            
            const data = await res.json();
            
            graph.clear();
            
            if (data.graph) {
                graph.configure(data.graph);
                if (typeof syncWidgetsFromProperties === 'function') syncWidgetsFromProperties(graph);
            } else {
                toast('No visual graph data found', 'warn');
            }
            
            canvas.setDirty(true, true);
            canvas.draw(true, true);
            
            setLoadedUI(name); 
            toast(`Loaded: ${name}`, 'success');
            
        } catch (e) {
            console.error("Load failed:", e);
            toast('Failed to load: ' + e.message, 'error');
            resetWorkflowUI();
        }
    });
}

// ============================================================
// Global widget sync after graph load — safety net for any
// node type that may still be missing its onConfigure
// ============================================================
function syncWidgetsFromProperties(gr) {
    if (!gr || !gr._nodes) return;
    gr._nodes.forEach(function(node) {
        if (!node.widgets || !node.properties) return;
        for (var i = 0; i < node.widgets.length; i++) {
            var w = node.widgets[i];
            if (!w || !w.name) continue;
            var wName = w.name;
            // Try direct property name
            if (typeof node.properties[wName] === "string") {
                w.value = node.properties[wName];
                continue;
            }
            // Try snake_case variant
            var snake = wName.toLowerCase().replace(/[^a-z0-9]/g, "_");
            if (typeof node.properties[snake] === "string") {
                w.value = node.properties[snake];
                continue;
            }
            // Handle "Message (opt)" -> "message"
            var simple = wName.toLowerCase().replace(/\s*\([^)]*\)/g, "").replace(/[^a-z0-9]/g, "_");
            if (typeof node.properties[simple] === "string") {
                w.value = node.properties[simple];
            }
        }
    });
}

// ============================================================
// AI WORKFLOW LOADER
// ============================================================
function detectAndOfferWorkflow(reply) {
    // Try several patterns:
    // 1. ```json ... ``` fenced block
    // 2. ``` ... ``` generic fenced block
    // 3. Bare JSON array [ ... ] anywhere in the text
    let jsonStr = null;
    
    let match = reply.match(/```json\s*([\s\S]*?)```/);
    if (match) {
        jsonStr = match[1].trim();
    } else {
        match = reply.match(/```\s*([\s\S]*?)```/);
        if (match) jsonStr = match[1].trim();
    }
    
    if (!jsonStr) {
        // Look for a raw JSON array
        const arrayMatch = reply.match(/(\[\s*\{[\s\S]*\}\s*\])/);
        if (arrayMatch) jsonStr = arrayMatch[1].trim();
    }
    
    if (!jsonStr) return;
    
    // Unescape HTML entities BEFORE parsing
    jsonStr = jsonStr
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>');
    
    let nodes;
    try {
        nodes = JSON.parse(jsonStr);
    } catch (e) {
        // Try once more with more aggressive cleanup
        try {
            const cleaned = jsonStr
                .replace(/,\s*}/g, '}')
                .replace(/,\s*]/g, ']');
            nodes = JSON.parse(cleaned);
        } catch (e2) {
            console.warn('[ai-loader] Could not parse JSON:', e.message, '| Raw:', jsonStr.slice(0, 200));
            return;
        }
    }
    
    if (!Array.isArray(nodes) || nodes.length === 0) return;
    if (!nodes.every(n => n && (n.type || n.node_type))) return;
    
    // Remove any prior load button (in case of re-detect)
    document.querySelectorAll('.ai-load-workflow-btn').forEach(b => b.parentNode.removeChild(b));
    
    const body = document.getElementById('aiBody');
    const btnWrapper = document.createElement('div');
    btnWrapper.className = 'ai-load-workflow-btn';
    btnWrapper.style.cssText = 'padding: 8px 0; display:flex; gap:6px; justify-content:flex-start;';
    
    const loadBtn = document.createElement('button');
    loadBtn.className = 'ai-copy-btn';
    loadBtn.style.cssText = 'background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;';
    loadBtn.innerHTML = '⚡ Load this workflow onto canvas (' + nodes.length + ' nodes)';
    
    loadBtn.onmouseenter = () => { if (!loadBtn.disabled) loadBtn.style.background = '#059669'; };
    loadBtn.onmouseleave = () => { if (!loadBtn.disabled) loadBtn.style.background = '#10b981'; };
    
    loadBtn.onclick = () => {
        loadAIWorkflowToCanvas(nodes);
        loadBtn.innerHTML = '✓ Loaded to Canvas!';
        loadBtn.disabled = true;
        loadBtn.style.background = '#334155';
        loadBtn.style.cursor = 'default';
    };
    
    btnWrapper.appendChild(loadBtn);
    body.appendChild(btnWrapper);
    body.scrollTop = body.scrollHeight;
}

function loadAIWorkflowToCanvas(nodes) {
    if (!nodes || nodes.length === 0) return;
    
    function unescapeHtml(str) {
        return String(str || '')
            .replace(/&gt;/g, '>')
            .replace(/&lt;/g, '<')
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'");
    }
    
    graph.clear();
    
    const typeMap = {
        'trigger/webhook': 'trigger/webhook',
        'market/data': 'market/data',
        'logic/filter': 'logic/filter',
        'logic/math': 'logic/math',
        'logic/compare': 'logic/compare',
        'logic/json-extract': 'logic/json-extract',
        'logic/code': 'logic/code',
        'logic/delay': 'logic/delay',
        'action/http': 'action/http',
        'tool/integration': 'tool/integration',
        'output/console': 'output/console'
    };
    
    const startX = 100;
    const startY = 100;
    const colSpacing = 420;
    const rowSpacing = 260;
    const cols = 3;
    
    let prevNode = null;
    let addedNodes = [];
    
    nodes.forEach((n, i) => {
        const nodeType = typeMap[n.type];
        if (!nodeType) {
            console.warn('[ai-loader] Unknown type:', n.type);
            return;
        }
        
        const node = LiteGraph.createNode(nodeType);
        if (!node) return;
        
        const props = n.data || n.properties || {};
        
        if (props) {
            Object.keys(props).forEach(key => {
                let val = props[key];
                
                // Force EVERYTHING to be a string
                if (val === null || val === undefined) {
                    val = '';
                } else if (typeof val === 'object') {
                    val = JSON.stringify(val);
                } else if (typeof val !== 'string') {
                    val = String(val);
                }
                
                // Unescape HTML entities
                val = unescapeHtml(val);
                
                node.properties[key] = val;
            });
            
            if (node.widgets) {
                node.widgets.forEach(w => {
                    const propKey = w.name.toLowerCase().replace(/[^a-z0-9]/g, '_');
                    let wval = props[propKey] !== undefined ? props[propKey] : props[w.name];
                    if (wval === undefined) return;
                    // Force string
                    if (wval === null || wval === undefined) wval = '';
                    else if (typeof wval === 'object') wval = JSON.stringify(wval);
                    else if (typeof wval !== 'string') wval = String(wval);
                    w.value = unescapeHtml(wval);
                });
            }
            
            if (node.type === 'logic/code') {
                const code = props.code || '';
                if (code) {
                    node.properties.code = unescapeHtml(code);
                    if (node.codePreviewWidget) {
                        node.codePreviewWidget.value = unescapeHtml(code);
                    }
                }
            }
        }
        
        const col = i % cols;
        const row = Math.floor(i / cols);
        node.pos = [startX + (col * colSpacing), startY + (row * rowSpacing)];
        
        graph.add(node);
        addedNodes.push(node);
        
        if (prevNode) {
            try {
                prevNode.connect(0, node, 0);
            } catch (e) {}
        }
        prevNode = node;
    });
    
    setTimeout(() => {
        if (addedNodes.length === 0) return;
        let minX = Infinity, minY = Infinity;
        let maxX = -Infinity, maxY = -Infinity;
        addedNodes.forEach(n => {
            minX = Math.min(minX, n.pos[0]);
            minY = Math.min(minY, n.pos[1]);
            maxX = Math.max(maxX, n.pos[0] + n.size[0]);
            maxY = Math.max(maxY, n.pos[1] + n.size[1]);
        });
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        const rect = canvas.canvas.getBoundingClientRect();
        const graphWidth = maxX - minX + 200;
        const graphHeight = maxY - minY + 200;
        let newScale = Math.min(rect.width / graphWidth, rect.height / graphHeight);
        newScale = Math.max(0.4, Math.min(1.2, newScale));
        canvas.ds.scale = newScale;
        canvas.ds.offset[0] = (rect.width / (2 * newScale)) - centerX;
        canvas.ds.offset[1] = (rect.height / (2 * newScale)) - centerY;
        canvas.setDirty(true, true);
        canvas.draw(true, true);
    }, 100);
    
    toast('Loaded ' + addedNodes.length + ' nodes from AI!', 'success', 2500);
}

(function() {
    'use strict';
    
    const panel = document.getElementById('aiPanel');
    const header = document.getElementById('aiHeader');
    const body = document.getElementById('aiBody');
    const input = document.getElementById('aiInput');
    const sendBtn = document.getElementById('aiSendBtn');

    if (!panel || !header || !body || !input) {
        console.error('[ai] Missing required DOM elements');
        return;
    }
    
    // ---- State ----
    const STORAGE_KEY = 'workflow-ai-history';
    const MODEL_STORAGE_KEY = 'workflow-ai-model';
    let history = [];
    let busy = false;
    
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) history = JSON.parse(saved) || [];
    } catch (_) { history = []; }
    
    function saveHistory() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-30))); } catch (_) {}
    }
    
    // ---- Markdown ----
    function renderMarkdown(text) {
        let out = String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

        out = out.replace(/```action\n?([\s\S]*?)```/g, (m, code) => {
            return '<pre class="ai-action-block" data-action="' + encodeURIComponent(code) + '">' + code + '</pre>';
        });

        out = out.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
            const cleanCode = code.replace(/^\n/, '').replace(/\n$/, '');
            const encoded = encodeURIComponent(cleanCode);
            const langLabel = lang || 'code';
            return '<div class="ai-code-block" data-code="' + encoded + '">' +
                   '<div class="ai-code-header">' +
                     '<span class="ai-code-lang">' + langLabel + '</span>' +
                     '<button class="ai-copy-btn" data-code="' + encoded + '" title="Copy to clipboard">' +
                       '<span>Copy</span>' +
                     '</button>' +
                   '</div>' +
                   '<pre class="ai-code-content">' + cleanCode + '</pre>' +
                 '</div>';
        });

        out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');

        const parts = out.split(/(<pre[\s\S]*?<\/pre>|<div class="ai-code-block"[\s\S]*?<\/div>)/);
        for (let i = 0; i < parts.length; i++) {
            if (!parts[i].startsWith('<pre') && !parts[i].startsWith('<div class="ai-code-block"')) {
                parts[i] = parts[i].replace(/\n/g, '<br>');
            }
        }
        out = parts.join('');

        return out;
    }
    
    function appendMessage(role, text) {
        const el = document.createElement('div');
        el.className = 'ai-msg ' + role;
        el.innerHTML = role === 'bot' ? renderMarkdown(text) : String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        body.appendChild(el);
        body.scrollTop = body.scrollHeight;
    }
    
    function appendThinking() {
        const el = document.createElement('div');
        el.className = 'ai-thinking';
        el.textContent = 'Thinking';
        body.appendChild(el);
        body.scrollTop = body.scrollHeight;
        return el;
    }
    
    function renderHistory() {
        body.innerHTML = '';
        if (history.length === 0) {
            appendMessage('bot', "Hi! I'm your workflow assistant. Ask me anything.");
        } else {
            history.forEach(h => appendMessage(h.role, h.text));
        }
    }
    
    // ---- Send ----
    async function sendMessage(text) {
        text = String(text || '').trim();
        if (!text || busy) return;
        busy = true;
        if (sendBtn) sendBtn.disabled = true;
        
        appendMessage('user', text);
        history.push({ role: 'user', text });
        const thinking = appendThinking();
        
        try {
            const res = await fetch('/ai-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    history: history.slice(-10),
                    model: (modelSelector && modelSelector.value) || 'gemini-flash'
                })
            });
            const data = await res.json();
            thinking.remove();
            
            if (!res.ok || data.error) {
                const errText = data.error || ('Server error ' + res.status);
                appendMessage('bot', 'Warning: ' + errText);
                history.push({ role: 'bot', text: 'Warning: ' + errText });
            } else {
                const reply = data.reply || '(empty)';
                appendMessage('bot', reply);
                history.push({ role: 'bot', text: reply });
                
                // Detect JSON workflow in the reply and offer a load button
                if (typeof detectAndOfferWorkflow === 'function') {
                    detectAndOfferWorkflow(reply);
                }
            }
            saveHistory();
        } catch (err) {
            thinking.remove();
            appendMessage('bot', 'Network error: ' + err.message);
        } finally {
            busy = false;
            if (sendBtn) sendBtn.disabled = false;
            input.focus();
        }
    }
    
    // ---- Input handlers ----
    function handleSendFromInput() {
        const v = input.value.trim();
        if (!v) return;
        input.value = '';
        input.style.height = 'auto';
        sendMessage(v);
    }
    
    input.addEventListener('keydown', (e) => {

            e.preventDefault();
            handleSendFromInput();

    input.addEventListener('input', () => {

    if (sendBtn) {

    // ---- Toggle ----

            if (panel.classList.contains('collapsed')) {
                panel.classList.remove('collapsed');
            }
            sendMessage(btn.dataset.prompt);
        });
    });
    
    // ---- Model selector ----
    async function loadModels() {
        if (!modelSelector) return;
        try {
            const res = await fetch('/ai-models');
            const data = await res.json();
            modelSelector.innerHTML = '';
            data.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.key;
                opt.textContent = m.label + (m.available ? '' : ' (not configured)');
                opt.disabled = !m.available;
                modelSelector.appendChild(opt);
            });
            const saved = localStorage.getItem(MODEL_STORAGE_KEY);
            if (saved && Array.from(modelSelector.options).some(o => o.value === saved && !o.disabled)) {
                modelSelector.value = saved;
            } else {
                const firstAvail = Array.from(modelSelector.options).find(o => !o.disabled);
                if (firstAvail) modelSelector.value = firstAvail.value;
            }
            console.log('[models] Loaded', data.models.length, 'models');
        } catch (e) {
            console.warn('[models] Could not load:', e);
        }
    }
    
    if (modelSelector) {
        modelSelector.addEventListener('change', () => {
            localStorage.setItem(MODEL_STORAGE_KEY, modelSelector.value);
        });
        ['click', 'mousedown', 'mouseup'].forEach(evt => {
            modelSelector.addEventListener(evt, (e) => e.stopPropagation());
        });
        loadModels();
    }
    

    // ============ COPY BUTTON HANDLER ============
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('.ai-copy-btn');
        if (!btn) return;

        const encoded = btn.dataset.code;
        if (!encoded) return;

        const code = decodeURIComponent(encoded);

        try {
            await navigator.clipboard.writeText(code);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span>Copied</span>';
            btn.style.color = '#22c55e';
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.color = '';
            }, 1500);
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = code;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                btn.innerHTML = '<span>Copied</span>';
                btn.style.color = '#22c55e';
                setTimeout(() => {
                    btn.innerHTML = '<span>Copy</span>';
                    btn.style.color = '';
                }, 1500);
            } catch (e2) {
                alert('Copy failed. Select and copy manually.');
            }
            document.body.removeChild(textarea);
        }
    });
    // ============ END COPY BUTTON HANDLER ============

        // ---- Initial render ----
    renderHistory();
    console.log('[ai] AI panel ready');
})();

</script>
</body>
</html>
