<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gmail Icon — split color M</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #000000;
    color: #e2e8f0;
    font-family: -apple-system, 'Inter', sans-serif;
    margin: 0;
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  p.sub { color: #64748b; font-size: 13px; margin: 0 0 24px 0; }
  .row {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    margin-bottom: 32px;
  }
  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .label {
    font-size: 10px;
    color: #3f3f46;
    font-family: ui-monospace, monospace;
  }
  .wrap {
    background: #000000;
    border: 1px solid #1f1f1f;
    border-radius: 8px;
    padding: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .wrap.small { padding: 8px; }
  .row-sim {
    display: flex;
    gap: 20px;
    padding: 20px;
    background: #0a0a0a;
    border: 1px solid #1a1a1a;
    border-radius: 10px;
    flex-wrap: wrap;
  }
  h2 { font-size: 13px; font-weight: 600; color: #f1f5f9; margin: 24px 0 8px 0; }
</style>
</head>
<body>

<h1>Gmail icon — split color M</h1>
<p class="sub">Left: red + orange top corner. Right: warm color + green bottom. Center: blue M.</p>

<h2>All sizes</h2>
<div class="row">
  <div class="block">
    <div class="wrap small">
      <svg viewBox="0 0 32 32" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
        <!-- left vertical (red) -->
        <path d="M6 11 L9 11 L9 24 L6 24 Z" fill="#EA4335"/>
        <!-- left top corner (orange) -->
        <path d="M6 8 L9 8 L9 11 L6 11 Z" fill="#FB8C00"/>
        <!-- right vertical (green bottom, split from top) -->
        <path d="M23 17 L26 17 L26 24 L23 24 Z" fill="#34A853"/>
        <!-- right top corner (warm yellow-orange) -->
        <path d="M23 8 L26 8 L26 17 L23 17 Z" fill="#FBBC04"/>
        <!-- center M (blue) -->
        <path d="M6 8 L9 8 L16 16 L23 8 L26 8 L26 11 L16 21 L6 11 Z" fill="#4285F4"/>
      </svg>
    </div>
    <span class="label">14px</span>
  </div>

  <div class="block">
    <div class="wrap">
      <svg viewBox="0 0 32 32" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 11 L9 11 L9 24 L6 24 Z" fill="#EA4335"/>
        <path d="M6 8 L9 8 L9 11 L6 11 Z" fill="#FB8C00"/>
        <path d="M23 17 L26 17 L26 24 L23 24 Z" fill="#34A853"/>
        <path d="M23 8 L26 8 L26 17 L23 17 Z" fill="#FBBC04"/>
        <path d="M6 8 L9 8 L16 16 L23 8 L26 8 L26 11 L16 21 L6 11 Z" fill="#4285F4"/>
      </svg>
    </div>
    <span class="label">16px</span>
  </div>

  <div class="block">
    <div class="wrap">
      <svg viewBox="0 0 32 32" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 11 L9 11 L9 24 L6 24 Z" fill="#EA4335"/>
        <path d="M6 8 L9 8 L9 11 L6 11 Z" fill="#FB8C00"/>
        <path d="M23 17 L26 17 L26 24 L23 24 Z" fill="#34A853"/>
        <path d="M23 8 L26 8 L26 17 L23 17 Z" fill="#FBBC04"/>
        <path d="M6 8 L9 8 L16 16 L23 8 L26 8 L26 11 L16 21 L6 11 Z" fill="#4285F4"/>
      </svg>
    </div>
    <span class="label">20px</span>
  </div>

  <div class="block">
    <div class="wrap">
      <svg viewBox="0 0 32 32" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 11 L9 11 L9 24 L6 24 Z" fill="#EA4335"/>
        <path d="M6 8 L9 8 L9 11 L6 11 Z" fill="#FB8C00"/>
        <path d="M23 17 L26 17 L26 24 L23 24 Z" fill="#34A853"/>
        <path d="M23 8 L26 8 L26 17 L23 17 Z" fill="#FBBC04"/>
        <path d="M6 8 L9 8 L16 16 L23 8 L26 8 L26 11 L16 21 L6 11 Z" fill="#4285F4"/>
      </svg>
    </div>
    <span class="label">48px</span>
  </div>
</div>

<h2>In credentials panel context</h2>
<div class="row-sim">
  <!-- Gmail -->
  <div style="display:flex; align-items:center; gap:10px; background:#0a0a0a; border:1px solid #1a1a1a; border-radius:6px; padding:8px 12px; width:300px;">
    <div class="wrap small" style="padding:6px; width:28px; height:28px;">
      <svg viewBox="0 0 32 32" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 11 L9 11 L9 24 L6 24 Z" fill="#EA4335"/>
        <path d="M6 8 L9 8 L9 11 L6 11 Z" fill="#FB8C00"/>
        <path d="M23 17 L26 17 L26 24 L23 24 Z" fill="#34A853"/>
        <path d="M23 8 L26 8 L26 17 L23 17 Z" fill="#FBBC04"/>
        <path d="M6 8 L9 8 L16 16 L23 8 L26 8 L26 11 L16 21 L6 11 Z" fill="#4285F4"/>
      </svg>
    </div>
    <span style="font-size:12px; font-weight:600; color:#f1f5f9; flex:1;">Gmail SMTP</span>
    <span style="font-size:9px; font-weight:700; padding:1px 6px; border-radius:3px; background:rgba(34,197,94,0.2); color:#86efac;">configured</span>
    <span style="font-size:10px; color:#60a5fa; padding:0 8px;">Configure</span>
  </div>

  <!-- Slack -->
  <div style="display:flex; align-items:center; gap:10px; background:#0a0a0a; border:1px solid #1a1a1a; border-radius:6px; padding:8px 12px; width:300px;">
    <div class="wrap small" style="padding:6px; width:28px; height:28px;">
      <i class="fab fa-slack" style="font-size:14px; color:#611f69;"></i>
    </div>
    <span style="font-size:12px; font-weight:600; color:#f1f5f9; flex:1;">Slack</span>
    <span style="font-size:9px; font-weight:700; padding:1px 6px; border-radius:3px; background:rgba(34,197,94,0.2); color:#86efac;">configured</span>
    <span style="font-size:10px; color:#60a5fa; padding:0 8px;">Configure</span>
  </div>

  <!-- Discord -->
  <div style="display:flex; align-items:center; gap:10px; background:#0a0a0a; border:1px solid #1a1a1a; border-radius:6px; padding:8px 12px; width:300px;">
    <div class="wrap small" style="padding:6px; width:28px; height:28px;">
      <i class="fab fa-discord" style="font-size:14px; color:#5865F2;"></i>
    </div>
    <span style="font-size:12px; font-weight:600; color:#f1f5f9; flex:1;">Discord</span>
    <span style="font-size:9px; font-weight:700; padding:1px 6px; border-radius:3px; background:rgba(34,197,94,0.2); color:#86efac;">configured</span>
    <span style="font-size:10px; color:#60a5fa; padding:0 8px;">Configure</span>
  </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</body>
</html>
